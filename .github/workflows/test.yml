name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test-bot:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      # goreleaser publishes prebuilt binaries as casks (brews is deprecated),
      # and casks have no `brew test`: installing one is the test.
      - name: Install every cask
        run: |
          shopt -s nullglob
          for f in Casks/*.rb; do
            brew install --cask "boostsecurityio/tap/$(basename "$f" .rb)"
          done
